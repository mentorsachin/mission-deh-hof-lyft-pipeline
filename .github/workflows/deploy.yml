name: Deploy Lyft Data Pipeline

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  STACK_NAME_INFRA: mission-deh-hof-infrastructure
  STACK_NAME_PIPELINE: mission-deh-hof-pipeline

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS Account ID
        id: account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "bucket_name=mission-deh-hof-nyctlc-$ACCOUNT_ID" >> $GITHUB_OUTPUT

      - name: Deploy Infrastructure Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/infrastructure.yaml \
            --stack-name ${{ env.STACK_NAME_INFRA }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides AccountId=${{ steps.account.outputs.account_id }} \
            --no-fail-on-empty-changeset

      - name: Upload Glue Scripts to S3
        run: |
          aws s3 sync glue-scripts/ s3://${{ steps.account.outputs.bucket_name }}/scripts/ --delete

      - name: Package Lambda function
        run: |
          cd lambda-scripts/pipeline-trigger
          zip -r ../../lambda-package.zip lambda_function.py
          cd ../..

      - name: Upload Lambda package to S3
        run: |
          aws s3 cp lambda-package.zip s3://${{ steps.account.outputs.bucket_name }}/lambda/pipeline-trigger.zip

      - name: Deploy Pipeline Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/pipeline.yaml \
            --stack-name ${{ env.STACK_NAME_PIPELINE }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides AccountId=${{ steps.account.outputs.account_id }} \
            --no-fail-on-empty-changeset

      - name: Deployment Summary
        run: |
          echo "============================================"
          echo "  ✅ DEPLOYMENT COMPLETE!"
          echo "============================================"
          echo "  Infrastructure Stack: ${{ env.STACK_NAME_INFRA }}"
          echo "  Pipeline Stack: ${{ env.STACK_NAME_PIPELINE }}"
          echo "  Region: ${{ env.AWS_REGION }}"
          echo "  S3 Bucket: ${{ steps.account.outputs.bucket_name }}"
          echo "============================================"
